; PlatformIO project for the optional ESP32 Wi-Fi bridge board. Two
; environments, one link to the RP2040 each - build whichever matches the
; ESP32 board actually in hand. See docs/esp32-network-bridge.md.
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; UART link (2 wires + GND to the RP2040) - works on any classic ESP32.
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; ESP-IDF-framework builds ignore build_src_filter (ESP-IDF's own CMake
; drives which files compile, see the esp32s3_usbhost env's comment below),
; so both link files are always fed to the compiler either way and are
; instead self-excluded by this macro - see the #ifdef at the top of each.
build_flags = -D JACK_LINK_UART
lib_deps =
    tzapu/WiFiManager@^2.0.17

[env:esp32s3_usbhost]
; USB host link (one USB-C cable straight into the RP2040's own USB port,
; no extra wiring) - needs an ESP32-S2/S3/P4 with native USB-OTG. Mixes in
; the espidf framework (Arduino runs as one of its components) so the
; plain-C usb_host_cdc_acm component in usb_host_link.cpp is available.
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf, arduino
monitor_speed = 115200
build_flags = -D JACK_LINK_USB_HOST
; Belt-and-suspenders with sdkconfig.defaults' CONFIG_PARTITION_TABLE_CUSTOM:
; PlatformIO's own Arduino-side partition handling generates the actual
; flashed partitions.bin independently of that ESP-IDF Kconfig setting in
; this hybrid build, silently overriding it with a 1MB-app default unless
; this is also set explicitly.
board_build.partitions = partitions_8mb.csv
lib_deps =
    tzapu/WiFiManager@^2.0.17
