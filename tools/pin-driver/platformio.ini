; Standalone PlatformIO project for a throwaway output-driver test rig.
; This DRIVES the Jabberin' Jack XL display panel directly from the RP2040,
; using the bus hypothesis built from ../pin-sniffer's captures. Only wire
; this up once the original XL controller chip is disconnected from the
; panel - two active drivers on the same lines can damage both chips.
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
monitor_speed = 115200
