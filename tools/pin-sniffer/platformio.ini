; Standalone PlatformIO project for a throwaway GPIO-change logic sniffer.
; Not part of the face-rendering firmware in ../../firmware — this flashes
; the RP2040 with capture-only code so it can log the Jabberin' Jack XL's
; built-in controller's video-out pins instead of driving a display.
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
monitor_speed = 115200
