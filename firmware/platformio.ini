; PlatformIO project for the Jabberin' Jack replacement controller.
; https://docs.platformio.org/page/projectconf.html

[env:pico]
; PlatformIO's official "raspberrypi" platform defaults to the mbed-based
; Arduino core, which Arduino_GFX doesn't fully support (missing AVR-style
; pin macros). Use the community platform that ships earlephilhower's
; arduino-pico core instead, which is what Arduino_GFX actually targets.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
monitor_speed = 115200
lib_deps =
    moononournation/GFX Library for Arduino@^1.6.7

; The clone board matches the Pico pinout but ships with more flash than the
; stock 2MB. If PlatformIO doesn't size it correctly on its own, uncomment
; and set to match (check the flash chip part number on the board):
; board_build.flash_size = 4MB
